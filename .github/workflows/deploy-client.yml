name: Deploy Client (Website)

# Auto-deploys when client changes on main (or manually: Actions tab -> Run workflow).
# Server: 179.66.148.169 | user: mwp | repo: /var/www/mwp | PM2 app: mwp-client
# The real work is done by /home/mwp/deploy.sh on the server (build, health check, auto-rollback).
# Required secret: SSH_PRIVATE_KEY.  Optional overrides: SSH_HOST, SSH_USER.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:

concurrency:
  group: mwp-deploy-client
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy mwp-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '179.66.148.169' }}
          username: ${{ secrets.SSH_USER || 'mwp' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: /home/mwp/deploy.sh client
